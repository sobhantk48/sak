name: Prepare Flutter Engine Source

on: 
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Install Depot Tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$GITHUB_WORKSPACE/depot_tools" >> $GITHUB_PATH

      - name: Fetch Flutter Engine
        run: |
          mkdir engine
          cd engine
          fetch --nohooks flutter
          gclient sync --no-history

      - name: Compress and Split Source Code
        run: |
          cd engine
          # اینجا به جای یه فایل، فایل‌ها رو تو پارت‌های ۱۸۰۰ مگابایتی تیکه‌تیکه می‌کنیم
          tar -czf - src/ | split -b 1800M - flutter_engine.tar.gz.part_

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: engine-source-v1
          # آپلود کردن تمام پارت‌های ساخته شده
          files: engine/flutter_engine.tar.gz.part_*

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: engine-source-v1
          files: engine/flutter_engine_src.tar.gz
